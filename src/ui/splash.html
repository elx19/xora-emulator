<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>XORA</title>
<link rel="stylesheet" href="splash.css" />
</head>
<body>
<div class="splash" id="splash">
  <!-- 极简苹果风氛围层：柔和光晕，缓慢呼吸 -->
  <div class="aura" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>

  <!-- Logo 区域 -->
  <div class="logo-wrap">
    <div class="logo-glow" aria-hidden="true"></div>
    <img class="logo" id="logo" src="assets/xora-icon.png" alt="XORA" draggable="false" />
    <div class="brand">XORA</div>
  <div class="tagline">Emulador Android ligero para Windows</div>
  </div>

  <!-- 进度条 -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- 状态文字 -->
  <div class="status" id="status">Preparando…</div>

  <!-- 首次安装提示（默认隐藏，由主进程控制显示） -->
  <div class="first-run" id="firstRun" hidden>
    <div class="first-run-title" id="firstRunTitle">Primer uso · configuración automática</div>
    <ul class="first-run-list" id="firstRunList">
      <li>Descargar el runtime de Android una sola vez</li>
      <li>Descargar la imagen oficial con Google Play</li>
      <li>Configurar aceleración de hardware y red</li>
      <li>Después podrás abrir APK y accesos directos</li>
    </ul>
  </div>

  <!-- 底部版权 -->
  <div class="footer">XORA · v<span id="ver"></span></div>
</div>

<script src="i18n-catalog.js"></script>
<script src="i18n.js"></script>
<script src="splash.js"></script>
</body>
</html>
