appId: com.xora.emulator
productName: XORA
copyright: Copyright © 2026 XORA

directories:
  output: dist/release
  buildResources: build

# Solo incluye lo necesario para ejecutar XORA. El código entra sin asar porque
# el proxy de ventanas necesita rutas reales para los scripts .ps1.
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Descomprime las imágenes .xz del runtime con el módulo NAPI precompilado.
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Solo conserva los idiomas de interfaz incluidos por XORA; así Electron ocupa
# unos 3 MB en lugar de cargar todos sus locales.
electronLanguages:
  - es-ES
  - en-US

# El instalador normal es ligero. El runtime pesado se descarga desde el
# Release oficial de GitHub durante el primer uso y queda fuera del instalador.
# Para una distribución completamente desconectada usa electron-builder-full.yml.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/xora-icon.png
  # Instala para el usuario actual, sin escribir en carpetas del sistema ni
  # solicitar permisos de administrador.
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# El objetivo appx solo se usa para el paquete de la tienda
# (npm run build:appx); npm run build:exe genera únicamente el instalador NSIS.
#
# identityName / publisher deben coincidir exactamente con los valores de
# Partner Center → Product management → Product identity.
# Estos valores se confirmaron el 2026-11-16;
# Para cambiar la identidad del producto, modifica estos valores o usa las
# variables XORA_MSIX_IDENTITY / XORA_MSIX_PUBLISHER.
# El publisher de ejemplo solo sirve para pruebas locales. Antes de publicar,
# usa la identidad real registrada para XORA en Partner Center.
appx:
  identityName: XORA.Emulator
  publisher: "CN=XORA"
  publisherDisplayName: XORA
  displayName: XORA
  applicationId: XORA
  # Capacidad mínima para una aplicación de escritorio de confianza total. No se
  # añaden unvirtualizedResources ni broadFileSystemAccess: el directorio de
  # datos vive en %USERPROFILE%\XORA y evita la redirección de AppData.
  capabilities:
    - runFullTrust
  languages:
    - es-ES
    - en-US
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # El asistente permite elegir la ubicación de instalación. El runtime y sus
  # datos se almacenan aparte y pueden moverse desde Configuración.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always vuelve a crear el acceso directo para que siempre apunte al ejecutable
  # actual, incluso si quedó un enlace roto de una instalación anterior.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: XORA-${version}-Setup.exe
  # Cierra el runtime antes de desinstalar para que los archivos no queden
  # bloqueados por QEMU o ADB.
  include: build/installer.nsh
  # El instalador ligero no incluye el runtime pesado. XORA lo descarga desde
  # el Release firmado de GitHub durante el primer uso. Para una instalación
  # sin conexión existe electron-builder-full.yml.

# Compresión normal (zlib). El runtime ya está comprimido; aquí solo se
# comprimen las DLL de Electron. Mantenerlo en este archivo evita problemas de
# PowerShell al pasar opciones inline desde CI.
compression: normal

# ---------------- Linux / FydeOS ----------------
# La configuración vive aquí para mantener un único esquema compatible con
# electron-builder 26 y evitar que una configuración antigua de package.json
# interfiera en las compilaciones de Windows.
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/xora-icon.png
  desktop:
    entry:
      Name: XORA
      Comment: Gestiona aplicaciones Android en FydeOS y Linux
      Categories: Utility;
