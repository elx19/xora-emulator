name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Construir versión portátil y publicar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (incluye Electron)
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Ejecutar pruebas
        run: npm test

      - name: Empaquetar versión portátil
        run: npm run pack

      # 用 7-Zip 而不是 Compress-Archive：同一个目录，.NET deflate 压出来 105MB，
      # 7-Zip -mx=9 只要 99.6MB —— 差这 5MB 就决定 Gitee 上放的是「一个能直接解压的
      # zip」还是「两个必须手工拼接的 part」。build/zip.js 还带体积闸门：超过
      # 100MiB 直接让 job 失败，避免以后又悄悄退回分片包。
      - name: Comprimir artefacto (7-Zip, límite de 100 MiB)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/XORA-win64-portable "XORA-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "XORA-$tag-win64-portable.zip" | Select-Object Name, Length

      # 增量更新资产：清单 + 代码层 zip（只有 resources/app，几 MB）。
      # 客户端本机 Electron 版本一致时只下这两个小文件，不再每次重下 ~100MB 整包；
      # 版本不一致 / 校验不过会自动退回完整包，所以整包照常发布。
      - name: Generar actualización incremental (manifiesto y código)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/incremental.js dist/XORA-win64-portable $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Manifiesto de seguridad para el actualizador XORA. La clave privada solo
      # existe como secreto de Actions; sin ella no se publica una Release,
      # porque el cliente no debe ejecutar paquetes sin firma verificable.
      - name: Generar manifiesto firmado de XORA
        shell: pwsh
        env:
          XORA_UPDATE_PRIVATE_KEY: ${{ secrets.XORA_UPDATE_PRIVATE_KEY }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $ver = $tag.TrimStart('v')
          $zip = "XORA-$tag-win64-portable.zip"
          $securityManifest = "XORA-v$ver-update-manifest.json"
          if (-not $env:XORA_UPDATE_PRIVATE_KEY) {
            Write-Error "Falta XORA_UPDATE_PRIVATE_KEY; se cancela la publicación insegura."
            exit 1
          }
          node build/sign-update-manifest.js --asset $zip --version $ver --platform win32-x64 --channel stable --output $securityManifest --release-notes "https://github.com/elx19/xora-emulator/releases/tag/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 创建 Release 并上传轻量便携版（壳层极小，运行时首次启动按需下载）
      - name: Crear Release de XORA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "XORA-$tag-win64-portable.zip"
          $ver = $tag.TrimStart('v')
          $manifest = "XORA-v$ver-manifest.json"
          $securityManifest = "XORA-v$ver-update-manifest.json"
          $appzip = "XORA-v$ver-app.zip"
          # 幂等：release 已存在（如重跑 / 重推 tag）就跳过 create，只上传资产。
          # 但说明要每次都回填：以前只在 create 时写 notes，导致已有 release 的 body
          # 永远停在自动生成的「Full Changelog」一行（0.6.1~0.6.4 就是这样丢的）。
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # 有手写的发版说明就用它（.github/release-notes-<tag>.md），比 --generate-notes
          # 的「Full Changelog」有用得多；没有才退回自动生成。
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "XORA $tag" --notes-file $notes
            } else {
              gh release create $tag --title "XORA $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif (Test-Path $notes) {
            # release 已存在：把最新的手写说明写回去（覆盖那段 Full Changelog）
            gh release edit $tag --title "XORA $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { Write-Error "回填 $tag 说明失败"; exit 1 }
          }
          # Retirar activos con la identidad histórica para que un reintento no
          # deje dos nombres del producto visibles en la misma Release.
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $legacyAssets = gh api "repos/${{ github.repository }}/releases/$($release.id)/assets" | ConvertFrom-Json |
            Where-Object { $_.name -match '^(ApkStart|apkstart)-' }
          foreach ($legacy in $legacyAssets) {
            gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$($legacy.id)"
            if ($LASTEXITCODE -ne 0) { Write-Error "No se pudo retirar el activo histórico $($legacy.name)"; exit 1 }
          }
          $upload = @($zip, $manifest, $appzip)
          if (Test-Path $securityManifest) { $upload += $securityManifest }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag @upload --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip / $manifest / $appzip"; exit 1 }
          node scripts/verify-release-artifact.js --manifest $securityManifest --asset $zip --platform win32-x64 --channel stable --version $ver
          if ($LASTEXITCODE -ne 0) { Write-Error "El artefacto publicado no supera la verificación firmada"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # 同步到 Gitee：国内直连 GitHub 只有几十 KB/s，Gitee 通常能跑几 MB/s。
      # 便携包压紧后约 99.6MB，在 Gitee 单文件上限（100MB）以内，直接放一个整包，
      # 用户点开就能解压；只有超限时 publish-gitee.js 才退回 .part1/.part2 分片。
      # Setup（1.4GB）与运行时整包（1.4GB）超限太多，只留在 GitHub ——
      # 应用端对「哪个源有资产」是取并集的，不影响更新。
      # Gitee 同步「缺 token / 网络不通」只告警不阻断：否则整 build job 变红，
      # 下面 needs: build 的 full job 会被整段跳过，连 GitHub 自己的 Setup / 运行时整包都发不出。
      # 缺 token 时这一步仍会在日志里标红（continue-on-error 是「可见但非致命」），不静默。
      - name: Sincronizar versión portátil con Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          # 以前这里是「没配 token 就静默跳过、这一步仍显示成功」——
          # v0.3.4 就这样在 Gitee 上悄悄少了一个版本，事后才发现。
          # 现在缺 token 直接让这一步失败，宁可红一次也别再无声无息。
          if (-not $env:GITEE_TOKEN) {
            Write-Error "缺少 GITEE_TOKEN：Gitee 这一版不会有安装包。请在 Settings → Secrets and variables → Actions 添加 GITEE_TOKEN（勾选 projects + pull_requests 之外的 releases 权限即可）。"
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          # 发布说明与 GitHub 用同一份，别让 Gitee 那边只剩一句「便携版安装包」
          $notes = ".github/release-notes-$tag.md"
          # 增量资产（清单 + 代码包）都很小，一起同步，国内用户更新也走增量
          $ver = $tag.TrimStart('v')
          $manifest = "XORA-v$ver-manifest.json"
          $appzip = "XORA-v$ver-app.zip"
          $incArgs = @("--extra", $manifest, "--extra", $appzip)
          if (Test-Path $notes) {
            node tools/publish-gitee.js $tag --zip "XORA-$tag-win64-portable.zip" --notes $notes @incArgs
          } else {
            node tools/publish-gitee.js $tag --zip "XORA-$tag-win64-portable.zip" @incArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Construir versión completa (runtime integrado y uso sin conexión)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 从 Google 官方源组装运行时（emulator + platform-tools + aehd + Play x86_64 镜像）。
      # 输出到 engine/，与本地开发时的目录结构一致。
      - name: Preparar runtime
        run: node build/fetch-runtime.js engine

      # prepare-runtime 会把 system.img/vendor.img 压成 xz(LZMA2)。
      # CI runner 只有 2 核：XZ_PRESET=6 把压缩时间从 ~2h 降到 ~40min（体积 +3%）。
      # XZ_TIMEOUT_MS 是看门狗：超时自动 kill 并落 gzip 兜底，
      # 绝不重演「stdin 没接 EOF → 0 字节输出 → 挂死 3 小时」。
      - name: Comprimir runtime con XZ
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # 内置微软 VC++ 2015-2022 x64 运行库：安卓模拟器（Qt6）与 qemu 都依赖它，
      # 缺了在「其他电脑」上会直接起不来（0xc0000135 / MSVCP140 缺失）。
      # 放到 build/runtime 内，随 extraResources 一起打进安装包；离线也能一键安装。
      - name: Incluir runtime de VC++ para uso sin conexión
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "下载 VC++ 2015-2022 x64 运行库…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "vc_redist 下载失败" }
          Get-Item $out | Select-Object Name, Length

      # 不打 git tag 时 electron-builder 不会隐式发布；打了 tag 也会因为本 job 没有
      # GH_TOKEN 而报 "GitHub Personal Access Token is not set" 后退出 1（之前完整版一直失败的根因）。
      # 这里显式 --publish never，安装包由后面「上传完整版到 Release」步骤用 gh release upload 上传。
      - name: Construir instalador completo
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Subir instalador completo a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到 Setup.exe"; exit 1 }
          Write-Output ("上传 {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # 轻量版（不带运行时）不再去 dl.google.com 逐个下 emulator / 系统镜像，
      # 而是直接下这一个整包 —— 下载源与「软件更新」同为本项目 GitHub Release，
      # 国内网络稳定性、出问题后的排障都只在一个地方。
      # 内容已经是 .xz 压缩过的镜像，这里用 bsdtar 直接打 zip（不再二次压缩，省几十分钟）。
      - name: Empaquetar runtime para la versión ligera
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "XORA-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime 不完整"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "打包运行时失败"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Subir runtime a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "XORA-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
